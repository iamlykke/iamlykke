<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Sergei Usachev — Front-end Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.6" stop-color="#161b2e"/>
      <stop offset="1" stop-color="#2a1d4a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#f5c84c" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#f5c84c" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
  </defs>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .fade { opacity: 0; animation: fade .8s ease-out forwards; }
    .d1 { animation-delay: .2s } .d2 { animation-delay: .5s } .d3 { animation-delay: .8s } .d4 { animation-delay: 1.1s }
    @keyframes fade { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: none } }
    .cursor { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0 } }
  </style>

  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="18" fill="url(#grid)"/>
  <rect width="1200" height="320" rx="18" fill="url(#glow)"/>

  <!-- terminal dots -->
  <g transform="translate(48 40)">
    <circle r="6" fill="#ff5f57"/><circle cx="20" r="6" fill="#febc2e"/><circle cx="40" r="6" fill="#28c840"/>
  </g>

  <text x="48" y="104" class="mono fade d1" font-size="20" fill="#7d8590">
    <tspan fill="#28c840">lykke@novi-sad</tspan><tspan fill="#7d8590">:</tspan><tspan fill="#58a6ff">~</tspan><tspan fill="#e6edf3"> $ whoami</tspan><tspan class="cursor" fill="#f5c84c"> ▍</tspan>
  </text>

  <text x="46" y="176" class="sans fade d2" font-size="64" font-weight="800" fill="#f0f6fc" letter-spacing="-1.5">Sergei Usachev</text>

  <text x="48" y="220" class="sans fade d3" font-size="26" font-weight="500" fill="#c9d1d9">
    Front-end Developer <tspan fill="#f5c84c">·</tspan> building fast, crafted web interfaces
  </text>

  <g class="mono fade d4" font-size="17">
    <text x="48" y="270" fill="#7d8590">
      <tspan fill="#3178c6">TypeScript</tspan>  /  <tspan fill="#61dafb">React</tspan>  /  <tspan fill="#f0f6fc">Next.js</tspan>  /  <tspan fill="#ff5d01">Astro</tspan>  /  <tspan fill="#38bdf8">Tailwind</tspan>
    </text>
  </g>

</svg>
