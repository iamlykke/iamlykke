<svg xmlns="http://www.w3.org/2000/svg" width="560" height="210" viewBox="0 0 560 210" role="img" aria-label="Most used languages">
  <style>
    .card { fill: #ffffff; stroke: #d0d7de; }
    .h { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
    .t { font: 500 14px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
    .m { font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #59636e; }
    @media (prefers-color-scheme: dark) {
      .card { fill: #0d1117; stroke: #30363d; }
      .h, .t { fill: #f0f6fc; }
      .m { fill: #9198a1; }
    }
    .grow { transform-box: fill-box; transform-origin: left; animation: grow .9s cubic-bezier(.2,.8,.2,1) both; }
    @keyframes grow { from { transform: scaleX(0) } }
  </style>
  <rect x="0.5" y="0.5" width="559" height="209" rx="12" class="card"/>
  <text x="28" y="44" class="h">Most used languages</text>
  <text x="532" y="44" class="m" text-anchor="end">16 repos · 2026-10-27</text>
  <clipPath id="bar"><rect x="28" y="66" width="504" height="12" rx="6"/></clipPath>
  <g clip-path="url(#bar)">
    <rect x="28.0" y="66" width="309.7" height="12" fill="#3178c6" class="grow" style="animation-delay:0s"/>
    <rect x="337.7" y="66" width="87.2" height="12" fill="#ff5d01" class="grow" style="animation-delay:0.12s"/>
    <rect x="424.9" y="66" width="81.6" height="12" fill="#663399" class="grow" style="animation-delay:0.24s"/>
    <rect x="506.5" y="66" width="20.8" height="12" fill="#e34c26" class="grow" style="animation-delay:0.36s"/>
    <rect x="527.3" y="66" width="4.7" height="12" fill="#8b949e" class="grow" style="animation-delay:0.48s"/>
  </g>
    <g>
      <circle cx="34" cy="107" r="6" fill="#3178c6"/>
      <text x="48" y="112" class="t">TypeScript</text>
      <text x="264" y="112" class="m" text-anchor="end">61.4%</text>
    </g>
    <g>
      <circle cx="286" cy="107" r="6" fill="#ff5d01"/>
      <text x="300" y="112" class="t">Astro</text>
      <text x="516" y="112" class="m" text-anchor="end">17.3%</text>
    </g>
    <g>
      <circle cx="34" cy="137" r="6" fill="#663399"/>
      <text x="48" y="142" class="t">CSS</text>
      <text x="264" y="142" class="m" text-anchor="end">16.2%</text>
    </g>
    <g>
      <circle cx="286" cy="137" r="6" fill="#e34c26"/>
      <text x="300" y="142" class="t">HTML</text>
      <text x="516" y="142" class="m" text-anchor="end">4.1%</text>
    </g>
    <g>
      <circle cx="34" cy="167" r="6" fill="#8b949e"/>
      <text x="48" y="172" class="t">Other</text>
      <text x="264" y="172" class="m" text-anchor="end">0.9%</text>
    </g>
</svg>
